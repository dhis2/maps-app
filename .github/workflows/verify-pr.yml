name: 'verify pr'

on:
    pull_request:
        types:
            ['opened', 'labeled', 'reopened', 'synchronize', 'ready_for_review']

env:
    GIT_AUTHOR_NAME: '@dhis2-bot'
    GIT_AUTHOR_EMAIL: 'apps@dhis2.org'
    GIT_COMMITTER_NAME: '@dhis2-bot'
    GIT_COMMITTER_EMAIL: 'apps@dhis2.org'
    GH_TOKEN: ${{secrets.DHIS2_BOT_GITHUB_TOKEN}}
    CI: true

jobs:
    # Decides whether e2e runs: on ready PRs into master, and on any PR when `e2e run` or
    # `e2e record` is added. Other labels don't start e2e.
    setup-matrix:
        if: >-
            ${{
                (github.event.action == 'labeled' &&
                    contains(fromJSON('["e2e run", "e2e record"]'), github.event.label.name)) ||
                (github.event.action != 'labeled' &&
                    !github.event.pull_request.draft &&
                    github.event.pull_request.base.ref == github.event.repository.default_branch)
            }}
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.specs }}
        steps:
            - name: Remove the `e2e run` label so that adding it again starts another run
              if: ${{ github.event.label.name == 'e2e run' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
              run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/e2e%20run" --silent || echo "::warning::Could not remove the e2e run label"
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
            - uses: actions/checkout@v7
            - name: Generate Test matrix
              id: set-matrix
              run: echo "::set-output name=specs::$(node cypress/support/generateTestMatrix.js)"

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.x
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn d2-app-scripts build

            - name: Check the build includes the files maps-gl loads by URL
              run: ls build/app/assets/ee_worker-*.js build/app/assets/mapbox-gl-rtl-text-*.js

            - uses: actions/upload-artifact@v7
              with:
                  name: app-build
                  path: |
                      **/build
                      !**/node_modules
                  retention-days: 1

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.x
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Generate translations
              run: yarn d2-app-scripts i18n generate

            - name: Lint
              run: yarn d2-style check

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.x
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Generate translations
              run: yarn d2-app-scripts i18n generate

            - name: Test
              run: yarn d2-app-scripts test

    call-workflow-e2e-prod:
        # A run on a PR into another branch gets another check name, so it can't satisfy master's
        # required check after the PR's base changes to master
        name: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch && 'call-workflow-e2e-prod' || 'call-workflow-e2e-other-base' }}
        # Skipped through setup-matrix rather than inside the called workflow, so the required
        # e2e-tests-success check is never created as skipped (which would count as passed)
        needs: [build, lint, test, setup-matrix]
        uses: dhis2/workflows/.github/workflows/analytics-e2e-tests-prod.yml@maps-app
        with:
            should_record: ${{ contains(join(github.event.pull_request.labels.*.name), 'e2e record') }}
            spec-group: ${{ needs.setup-matrix.outputs.matrix }}
        secrets:
            username: ${{ secrets.CYPRESS_DHIS2_USERNAME }}
            password: ${{ secrets.CYPRESS_DHIS2_PASSWORD }}
            recordkey: ${{ secrets.CYPRESS_RECORD_KEY }}

    # Fork PRs and runs started by Dependabot get no secrets, so no bot token to write the comment
    e2e-comment:
        needs: [setup-matrix, call-workflow-e2e-prod]
        if: >-
            ${{
                !cancelled() &&
                (github.event.action != 'labeled' ||
                    contains(fromJSON('["e2e run", "e2e record"]'), github.event.label.name)) &&
                !github.event.pull_request.head.repo.fork &&
                github.actor != 'dependabot[bot]'
            }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: .github/scripts
            - name: Update the e2e comment
              uses: actions/github-script@v9
              env:
                  SETUP_RESULT: ${{ needs.setup-matrix.result }}
                  E2E_RESULT: ${{ needs.call-workflow-e2e-prod.result }}
              with:
                  github-token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
                  script: |
                      const updateE2eComment = require('./.github/scripts/e2e-comment.js')
                      await updateE2eComment({
                          github,
                          context,
                          setupResult: process.env.SETUP_RESULT,
                          e2eResult: process.env.E2E_RESULT,
                      })
