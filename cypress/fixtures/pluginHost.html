<!doctype html>
<!--
    Stands in for the dashboard app: embeds plugin.html in an iframe and
    answers the post-robot messages the app-shell PluginLoader expects.
    Initial props come from window.pluginProps (set in onBeforeLoad).
    Served by visitPlugin (cypress/elements/plugin.js), which also serves the
    post-robot script loaded below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Plugin host</title>
        <style>
            html,
            body {
                margin: 0;
            }
            #plugin-iframe {
                display: block;
                width: 800px;
                height: 500px;
                border: none;
            }
        </style>
        <script src="/plugin-host/post-robot.min.js"></script>
    </head>
    <body>
        <script>
            const iframe = document.createElement('iframe')
            iframe.id = 'plugin-iframe'
            iframe.src = '/plugin.html'
            document.body.appendChild(iframe)

            window.postRobot.on(
                'getPropsFromParent',
                { window: iframe.contentWindow },
                () => window.pluginProps
            )

            window.sendPluginProps = (props) => {
                window.pluginProps = props
                return window.postRobot.send(
                    iframe.contentWindow,
                    'updated',
                    props
                )
            }
        </script>
    </body>
</html>
